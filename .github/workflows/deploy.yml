name: Deploy vio-backend

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  id-token: write
  contents: read

env:
  ACR_REGISTRY: acrvioapi.azurecr.io
  IMAGE_NAME: vio-backend
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    name: "Deploy → ${{ github.event.inputs.environment || 'staging' }}"
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment == 'production' && 'production' || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set target environment
        id: env
        run: |
          ENV="${{ github.event.inputs.environment || 'staging' }}"
          echo "name=$ENV" >> $GITHUB_OUTPUT
          echo "rg=rg-api-vio-$ENV" >> $GITHUB_OUTPUT
          echo "app=ca-api-vio-$ENV" >> $GITHUB_OUTPUT
          echo "tag=$ENV-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name acrvioapi

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.env.outputs.tag }}
            ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.env.outputs.name }}-latest
          build-args: |
            VITE_FIREBASE_API_KEY=${{ steps.env.outputs.name == 'production' && secrets.FIREBASE_WEB_API_KEY_PROD || secrets.FIREBASE_WEB_API_KEY_QA }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ steps.env.outputs.name == 'production' && secrets.FIREBASE_WEB_AUTH_DOMAIN_PROD || secrets.FIREBASE_WEB_AUTH_DOMAIN_QA }}
            VITE_FIREBASE_PROJECT_ID=${{ steps.env.outputs.name == 'production' && 'reachu-prod' || 'reachu-qa' }}

      - name: Deploy new revision
        run: |
          az containerapp update \
            --name "${{ steps.env.outputs.app }}" \
            --resource-group "${{ steps.env.outputs.rg }}" \
            --image "${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.env.outputs.tag }}"

      - name: Notify success
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=✅ vio-backend desplegado en ${{ steps.env.outputs.name }}%0ACommit: ${{ github.sha }}%0APor: ${{ github.actor }}"

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=❌ Deploy FALLÓ en ${{ steps.env.outputs.name }}%0ACommit: ${{ github.sha }}%0ALogs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
